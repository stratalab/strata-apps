<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Five positions — every variation is a branch</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="room">
      <main class="hall">
        <header class="bar">
          <h1 class="wordmark">Five positions</h1>
          <p class="claim">
            Play it wrong and nothing is lost. Every line you try is a branch of the same database.
          </p>
        </header>

        <section class="picker" data-picker aria-label="Choose a position"></section>

        <section class="table" data-table hidden>
          <div class="stage">
            <div class="board-frame">
              <div class="board" data-board role="grid" aria-label="Chessboard"></div>
              <div class="varnish" aria-hidden="true"></div>
              <div class="files" data-files aria-hidden="true"></div>
              <div class="ranks" data-ranks aria-hidden="true"></div>
            </div>
            <p class="verdict" data-verdict aria-live="polite">&nbsp;</p>
          </div>

          <aside class="rail">
            <div class="brief">
              <p class="level" data-level></p>
              <h2 class="title" data-title></h2>
              <p class="goal" data-goal></p>
              <p class="prose" data-brief></p>
            </div>

            <div class="lines">
              <h3>Lines</h3>
              <ul class="line-list" data-lines></ul>
            </div>

            <div class="moves">
              <h3>This line</h3>
              <ol class="move-list" data-moves></ol>
            </div>

            <div class="rail-actions">
              <button type="button" class="act" data-another>Another</button>
              <button type="button" class="act" data-hint>Hint</button>
              <button type="button" class="act" data-back>Back to the five</button>
            </div>
          </aside>
        </section>

        <p class="call" data-call>&nbsp;</p>

        <footer class="colophon">
          <span>Rules by <a href="https://github.com/analog-hors/cozy-chess">cozy-chess</a>, MIT.</span>
          <span>
            Analysis by <a href="https://stockfishchess.org/">Stockfish 19 Lite</a>, unmodified,
            <a href="./stockfish/Copying.txt">GPL-3.0</a> —
            <a href="./stockfish/README.md">source and notice</a>.
          </span>
        </footer>
      </main>
    </div>

    <p class="boot" data-boot>Setting the board…</p>
    <script type="module" src="./bridge.js"></script>
  </body>
</html>
