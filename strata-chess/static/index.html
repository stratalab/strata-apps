<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chess</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="room">
      <main class="hall">
        <header class="masthead">
          <h1 class="wordmark">Chess</h1>
          <nav class="levels" data-levels aria-label="Difficulty"></nav>
        </header>

        <div class="table">
          <div class="stage">
            <div class="board-frame">
              <div class="board" data-board role="grid" aria-label="Chessboard"></div>
              <div class="varnish" aria-hidden="true"></div>
              <div class="files" data-files aria-hidden="true"></div>
              <div class="ranks" data-ranks aria-hidden="true"></div>
            </div>
            <p class="status" data-status aria-live="polite">&nbsp;</p>
          </div>

          <aside class="sheet">
            <p class="goal" data-goal></p>
            <ol class="score" data-score></ol>
            <div class="sheet-actions">
              <button type="button" class="act" data-another>Another position</button>
              <button type="button" class="act quiet" data-restart>Back to the position</button>
              <button type="button" class="act quiet" data-hint>Show me</button>
            </div>
          </aside>
        </div>

        <footer class="colophon">
          <p>
            Rules by <a href="https://github.com/analog-hors/cozy-chess">cozy-chess</a> under MIT.
            Play by <a href="https://stockfishchess.org/">Stockfish 19 Lite</a>, unmodified, under
            the <a href="./stockfish/Copying.txt">GPL v3</a>; its
            <a href="./stockfish/README.md">notice and source</a> ship beside it.
          </p>
        </footer>
      </main>
    </div>

    <p class="boot" data-boot>Setting the board</p>
    <script type="module" src="./bridge.js"></script>
  </body>
</html>
