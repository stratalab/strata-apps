[package]
name = "strata-colonies"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
publish = false
description = "Twenty Game of Life colonies on Strata branches — a live butterfly-effect stress demo"

[[bin]]
name = "colonies"
path = "src/main.rs"

[dependencies]
# strata-core is public and tagged, so the dependency is reproducible off this
# machine. For work against a local strata-core checkout, add a `[patch]` in an
# untracked `.cargo/config.toml` rather than editing this line.
stratadb = { git = "https://github.com/stratalab/strata-core", tag = "v1.2.3" }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
