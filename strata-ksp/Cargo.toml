[package]
name = "strata-ksp"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
publish = false
description = "Assemble a rocket, fork the launch, watch the other timeline stay in orbit"

[lib]
name = "strata_ksp"
path = "src/lib.rs"

[[bin]]
name = "ksp"
path = "src/main.rs"

[dependencies]
# strata-core is public and tagged, so the dependency is reproducible off this
# machine. For work against a local strata-core checkout, add a `[patch]` in an
# untracked `.cargo/config.toml` rather than editing this line.
stratadb = { git = "https://github.com/stratalab/strata-core", tag = "v1.2.3" }
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
